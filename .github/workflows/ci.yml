name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run check
      - run: npm run verify:ratios
      - run: npm run verify:song
      - run: npm run verify:canon
      - run: npm run verify:tension
      - run: npm run verify:halves
      - run: npm run verify:vina
      - run: npm run verify:helikon
      - run: npx playwright install --with-deps chromium firefox
      - run: npm run test:browser -- /tmp/pyknon-review/browser.json
      - run: python3 scripts/audio-oracle.py /tmp/pyknon-review/browser.json
      - run: npm run test:song -- /tmp/pyknon-song-review/browser.json
      - run: python3 scripts/song-oracle.py /tmp/pyknon-song-review/browser.json
      - run: python3 -m pip install -r scripts/requirements-audio.txt
      - run: npm run test:canon -- /tmp/pyknon-canon-review/browser.json
      - run: python3 scripts/canon-audio-oracle.py /tmp/pyknon-canon-review/browser.json
      - run: npm run test:rhythm -- /tmp/pyknon-rhythm-review
      - run: python3 scripts/rhythm-wave-oracle.py /tmp/pyknon-rhythm-review/chromium-1440
      - run: npm run test:tension -- /tmp/pyknon-tension-review
      - run: python3 scripts/tension-wave-oracle.py /tmp/pyknon-tension-review/review.json
      - run: node scripts/tension-integrity.mjs /tmp/pyknon-tension-integrity.json
      - run: npm run test:vina -- /tmp/pyknon-vina-review
      - run: python3 scripts/vina-oracle.py --browser /tmp/pyknon-vina-review/review.json
      - run: npm run verify:vina-files -- /tmp/pyknon-vina-review
      - run: npm run verify:vina-audio -- /tmp/pyknon-vina-review/review.json
      - name: Check verified source failures and delayed imports
        run: |
          npm run preview > /tmp/pyknon-vina-preview.log 2>&1 &
          VINA_PREVIEW_PID=$!
          trap 'kill "$VINA_PREVIEW_PID"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4329/pyknon/vina.html > /dev/null
          npm run test:vina-integrity -- http://127.0.0.1:4329/pyknon/ /tmp/pyknon-vina-integrity
      - run: npm run test:halves -- /tmp/pyknon-halves-review
      - run: python3 scripts/halves-wave-oracle.py /tmp/pyknon-halves-review/review.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python3 scripts/halves-artifacts.py /tmp/pyknon-halves-review
      - name: Review musical signs, native sound and portable source files
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 4444 --strictPort > /tmp/pyknon-notation-preview.log 2>&1 &
          NOTATION_PREVIEW_PID=$!
          trap 'kill "$NOTATION_PREVIEW_PID"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4444/pyknon/notation.html > /dev/null
          npm run test:notation -- http://127.0.0.1:4444/pyknon/ /tmp/pyknon-notation-review
          npm run verify:notation-files -- /tmp/pyknon-notation-review /tmp/pyknon-notation-review/artifacts.json
      - name: Review helikon geometry, native artifacts and verified source failures
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 4362 --strictPort > /tmp/pyknon-helikon-preview.log 2>&1 &
          HELIKON_PREVIEW_PID=$!
          trap 'kill "$HELIKON_PREVIEW_PID"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4362/pyknon/helikon.html > /dev/null
          npm run test:helikon -- http://127.0.0.1:4362/pyknon/ /tmp/pyknon-helikon-review
          npm run verify:helikon-files -- /tmp/pyknon-helikon-review
          npm run test:helikon-integrity -- http://127.0.0.1:4362/pyknon/ /tmp/pyknon-helikon-integrity
      - name: Verify styled development pages under their actual policies
        run: |
          npm run dev -- --port 4364 > /tmp/pyknon-helikon-development.log 2>&1 &
          HELIKON_DEV_PID=$!
          trap 'kill "$HELIKON_DEV_PID"' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4364/pyknon/helikon.html > /dev/null
          npm run test:helikon-development -- http://127.0.0.1:4364/pyknon/ /tmp/pyknon-helikon-development
      - name: Retain old offline work during an interrupted helikon upgrade
        run: |
          git fetch origin ba97e9c0f805eb8aa737b6c7d9a354b6154e9ff6
          HELIKON_PREVIOUS_DIR="$RUNNER_TEMP/pyknon-before-helikon"
          mkdir -p "$HELIKON_PREVIOUS_DIR"
          git archive ba97e9c0f805eb8aa737b6c7d9a354b6154e9ff6 | tar -x -C "$HELIKON_PREVIOUS_DIR"
          npm ci --prefix "$HELIKON_PREVIOUS_DIR"
          npm --prefix "$HELIKON_PREVIOUS_DIR" run build
          npm run test:helikon-upgrade -- "$HELIKON_PREVIOUS_DIR/dist" dist /tmp/pyknon-helikon-upgrade/review.json
          npm run verify:helikon-files -- /tmp/pyknon-helikon-upgrade --upgrade
