<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 920 328" width="920" height="328" style="max-width:100%;height:auto;font-family:Plex,Arial,sans-serif;background:white"><title>Same total duration, independently chosen division</title><desc>Reference: 3 up and 3 down. Chosen: 2 up and 4 down. Both span 6 primary times, 1800 milliseconds. Violet is up; teal is down. Dot attacks are modern signals.</desc><style>.rh-marker{transition:r .05s}.rh-marker.rh-sounding{stroke:#a94116;stroke-width:4;r:7}@media(prefers-reduced-motion:reduce){.rh-marker.rh-sounding{stroke-width:2;r:4}}</style><g data-rh-row="0"><text x="16" y="24" font-size="17" fill="#36275e">Reference</text><text x="16" y="49" font-size="13" fill="#675e72">3 up + 3 down · Equal · dactylic</text><rect x="16" y="66" width="444.00" height="30" fill="#36275e"/><rect x="460.00" y="66" width="444.00" height="30" fill="#176477"/><text x="238.00" y="86" font-size="17" text-anchor="middle" fill="white">3</text><text x="682.00" y="86" font-size="17" text-anchor="middle" fill="white">3</text><path d="M16.00 99 V112" stroke="#a9a0b4"/><text x="16.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">0</text><circle class="rh-marker" data-unit="0" cx="16.00" cy="147" r="5" fill="#36275e"/><path d="M164.00 99 V112" stroke="#a9a0b4"/><text x="164.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">1</text><path d="M312.00 99 V112" stroke="#a9a0b4"/><text x="312.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">2</text><path d="M460.00 99 V112" stroke="#a9a0b4"/><text x="460.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">3</text><circle class="rh-marker" data-unit="3" cx="460.00" cy="147" r="5" fill="#176477"/><path d="M608.00 99 V112" stroke="#a9a0b4"/><text x="608.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">4</text><path d="M756.00 99 V112" stroke="#a9a0b4"/><text x="756.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">5</text><path d="M904.00 99 V112" stroke="#a9a0b4"/><text x="904.00" y="130" font-size="12" text-anchor="middle" fill="#675e72">6</text></g><g data-rh-row="1"><text x="16" y="190" font-size="17" fill="#36275e">Your foot</text><text x="16" y="215" font-size="13" fill="#675e72">2 up + 4 down · Double · iambic</text><rect x="16" y="232" width="296.00" height="30" fill="#36275e"/><rect x="312.00" y="232" width="592.00" height="30" fill="#176477"/><text x="164.00" y="252" font-size="17" text-anchor="middle" fill="white">2</text><text x="608.00" y="252" font-size="17" text-anchor="middle" fill="white">4</text><path d="M16.00 265 V278" stroke="#a9a0b4"/><text x="16.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">0</text><circle class="rh-marker" data-unit="0" cx="16.00" cy="313" r="5" fill="#36275e"/><path d="M164.00 265 V278" stroke="#a9a0b4"/><text x="164.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">1</text><path d="M312.00 265 V278" stroke="#a9a0b4"/><text x="312.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">2</text><circle class="rh-marker" data-unit="2" cx="312.00" cy="313" r="5" fill="#176477"/><path d="M460.00 265 V278" stroke="#a9a0b4"/><text x="460.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">3</text><path d="M608.00 265 V278" stroke="#a9a0b4"/><text x="608.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">4</text><path d="M756.00 265 V278" stroke="#a9a0b4"/><text x="756.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">5</text><path d="M904.00 265 V278" stroke="#a9a0b4"/><text x="904.00" y="296" font-size="12" text-anchor="middle" fill="#675e72">6</text></g></svg>